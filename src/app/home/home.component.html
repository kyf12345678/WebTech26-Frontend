<div class="page-shell home-page">
  <section class="hero">
    <p class="eyebrow">Your daily dashboard</p>
    <h1>Make today count.</h1>
    <p>Small steps. Real progress.</p>
  </section>

  <app-progress
    [completed]="completedCount"
    [total]="todos().length">
  </app-progress>

  <section class="filters" aria-label="Task filters">
    <button
      type="button"
      [class.selected]="filter() === 'all'"
      (click)="setFilter('all')">
      <span>All Tasks</span>
      <strong>{{ todos().length }}</strong>
    </button>

    <button
      type="button"
      [class.selected]="filter() === 'active'"
      (click)="setFilter('active')">
      <span>Active Tasks</span>
      <strong>{{ activeCount }}</strong>
    </button>

    <button
      type="button"
      [class.selected]="filter() === 'completed'"
      (click)="setFilter('completed')">
      <span>Completed Tasks</span>
      <strong>{{ completedCount }}</strong>
    </button>
  </section>

  @if (showTasks()) {
    <section class="task-section">
      <div class="section-heading">
        <h2>Tasks</h2>
        <a routerLink="/tasks">Manage tasks</a>
      </div>

      <div class="task-list">
        @for (todo of visibleTodos; track todo._id) {
          <app-todo-item
            [todo]="todo"
            (toggleTodo)="toggleTodo($event)">
          </app-todo-item>
        } @empty {
          <div class="empty-state">
            <i class="bi bi-stars"></i>
            <strong>A clear slate</strong>
            <span>Try another view to find the tasks you need.</span>
          </div>
        }
      </div>
    </section>
  }
</div>
